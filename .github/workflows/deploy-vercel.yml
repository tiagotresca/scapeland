name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: "Vercel token (used only for this run; prefer the VERCEL_TOKEN repo secret)"
        required: false
  push:
    branches:
      - claude/scapeland-institutional-site-v9cvn8
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          TOKEN_INPUT: ${{ inputs.vercel_token }}
          TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TOKEN="${TOKEN_SECRET:-$TOKEN_INPUT}"
          if [ -z "$TOKEN" ]; then
            echo "No Vercel token: add a VERCEL_TOKEN repo secret (Settings > Secrets and variables > Actions) or pass one to this run."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          npx vercel@latest deploy --prod --yes --token "$TOKEN" 2>&1 | tail -5
